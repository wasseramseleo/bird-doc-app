<span class="marker-slot" data-testid="marker-slot-bemerkung">
  <!-- #374 (#1) / #468: das Detail-Zeichen — „in dieser Zeile steht mehr, als die
       Spalten zeigen". Der Tooltip trägt das Mehr im Klartext — die Vokabeln des
       Fangs und die freie Bemerkung, ausdrücklich als „Bemerkung: …"
       gekennzeichnet. Ein bloßes „Bemerkung vorhanden" wäre neben den
       Fangmarkern redundant, die eine Bemerkung ohnehin erzwingen.
       Screenreader-Beschriftung und Tooltip tragen denselben Text.

       #497 (PRD #491): wieder ein reines Zeichen, kein Knopf. Sein Klick steigt
       zur Zeile auf wie der von ♥ und ⚑ — die Zeile öffnet den Detail-Dialog
       (#494), das Zeichen muss den Weg nicht selbst tragen. Das `title` bleibt
       nativ — matTooltip kommt im ganzen Projekt null mal vor.

       Das `aria-hidden="false"` ist Absicht und muss **statisch** dastehen:
       `MatIcon` setzt sich im Konstruktor selbst `aria-hidden="true"`, solange
       es im Template kein geschriebenes `aria-hidden` findet (es liest ein
       `HostAttributeToken`, das eine `[attr.…]`-Bindung nicht sieht). Solange
       der Knopf (#478) die Beschriftung trug, war das richtig — das Zeichen
       darin war Zierde. Jetzt trägt das Zeichen sie selbst, und ohne diese
       Zeile fiele es stumm aus dem Zugänglichkeitsbaum: der Tooltip bliebe,
       die zugängliche Beschriftung wäre weg. Die beiden Fangmarker unten
       bleiben unangetastet — für sie gilt #497 „unverändert". -->
  @if (bemerkenswertes(); as mehr) {
    <mat-icon class="marker-icon detail-zeichen" inline
              data-testid="detail-zeichen"
              aria-hidden="false"
              [title]="mehr"
              [attr.aria-label]="mehr"
    >info_outline</mat-icon>
  }
</span>
<span class="marker-slot" data-testid="marker-slot-tot-fund">
  <!-- #371: distinct Fangmarker row icons (ADR 0026). -->
  @if (entry().is_dead_recovery) {
    <mat-icon class="marker-icon fangmarker-icon fangmarker-icon--dead" inline
              data-testid="tot-fund-icon"
              title="Tot-Fund" aria-label="Tot-Fund">heart_broken</mat-icon>
  }
</span>
<span class="marker-slot" data-testid="marker-slot-non-standard">
  @if (entry().is_non_standard) {
    <mat-icon class="marker-icon fangmarker-icon fangmarker-icon--non-standard" inline
              data-testid="non-standard-icon"
              title="Nicht-Standard-Fang" aria-label="Nicht-Standard-Fang">flag</mat-icon>
  }
</span>
